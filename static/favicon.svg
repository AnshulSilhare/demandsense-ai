<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="dsGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="dsGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="dsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0d9488" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Precision Diamond Frame -->
  <rect x="32" y="6" width="36.77" height="36.77" rx="7.5" transform="rotate(45 32 6)" stroke="url(#dsGrad1)" stroke-width="4" fill="rgba(13,148,136,0.12)" filter="url(#dsGlow)"/>

  <!-- Mid Concentric Diamond Ring -->
  <rect x="32" y="16.5" width="21.92" height="21.92" rx="4" transform="rotate(45 32 16.5)" stroke="url(#dsGrad2)" stroke-width="2.2" fill="rgba(30,58,95,0.2)"/>

  <!-- Inner Predictive Core Node -->
  <rect x="32" y="24" width="11.31" height="11.31" rx="2.5" transform="rotate(45 32 24)" fill="url(#dsGrad1)"/>

  <!-- Center Pulse Dot -->
  <circle cx="32" cy="32" r="2.2" fill="#ffffff"/>
</svg>
